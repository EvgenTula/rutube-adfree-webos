<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171820" />
    <title>RUTUBE AdFree · Phase 0</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <main class="shell" aria-labelledby="app-title">
      <div class="mark" aria-hidden="true"><span></span></div>
      <p class="eyebrow">LG webOS · Phase 0</p>
      <h1 id="app-title">RUTUBE AdFree</h1>
      <p class="summary">
        Базовое приложение готово к проверке на телевизоре.
      </p>
      <dl class="status-card" aria-label="Состояние базовой сборки">
        <div>
          <dt>Приложение</dt>
          <dd id="app-version">загрузка…</dd>
        </div>
        <div>
          <dt>Диагностика</dt>
          <dd id="debug-status">безопасный режим</dd>
        </div>
        <div>
          <dt>LG C1</dt>
          <dd class="pending">проверка ожидается</dd>
        </div>
      </dl>
      <p class="hint">Нажмите Back, чтобы закрыть приложение.</p>
    </main>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
