name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install pinned development tools
        run: npm ci

      - name: Run fixture and behavior tests
        run: npm test

      - name: Validate Chromium 79 application build
        run: npm run check

      - name: Produce and fingerprint the webOS package
        run: npm run package:webos
